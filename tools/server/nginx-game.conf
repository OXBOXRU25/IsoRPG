# Сайт игры. Собран вручную начисто.
#
# Certbot умеет дописывать ssl в существующий файл, но когда в файле уже есть
# блок с перенаправлением, он делает ssl-копию и этого блока тоже — получается
# https, который перенаправляет сам на себя. Поэтому здесь всё явно: один блок
# отдаёт сайт, второй уводит с http.

# Заход по имени: уводим на https, сохраняя имя.
server {
    listen 80;
    listen [::]:80;

    server_name mygame.oxboxdigital.ru 5.129.195.139.sslip.io;

    return 301 https://$host$request_uri;
}

# Всё остальное, включая заход по голому IP.
#
# Такие запросы уводим на домен, а не на $host: сертификатов на голый IP
# не выдают вовсе, и перенаправление на https://5.129.195.139 упиралось бы
# в ошибку сертификата.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 301 https://mygame.oxboxdigital.ru$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name mygame.oxboxdigital.ru 5.129.195.139.sslip.io;

    ssl_certificate /etc/letsencrypt/live/mygame.oxboxdigital.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mygame.oxboxdigital.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/game;
    index index.html;

    # Кириллица в именах файлов установщика.
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Файл истории и описание обновления лаунчер спрашивает при каждом запуске,
    # и ему нужна свежая копия, а не осевшая в кеше промежуточного узла.
    location ~* \.(md|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Сборки игры — большие файлы. Отдаём как загрузку и разрешаем докачку:
    # восемьдесят мегабайт по плохому каналу с первого раза доезжают не всегда.
    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header Accept-Ranges bytes;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/html;
    gzip_min_length 1024;
}
